version: "3"

vars:
  BIN_DIR: dist
  BIN: dist/taskbridge
  BASE_REV: HEAD~
  AIR: air
  GOLANGCI_LINT: golangci-lint
  GORELEASER: goreleaser
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || printf dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || printf unknown
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X github.com/yeisme/taskbridge/pkg/buildinfo.Version={{.VERSION}}
    -X github.com/yeisme/taskbridge/pkg/buildinfo.GitCommit={{.COMMIT}}
    -X github.com/yeisme/taskbridge/pkg/buildinfo.BuildDate={{.BUILD_DATE}}

tasks:
  default:
    desc: List available development tasks
    cmds:
      - task --list
    silent: true

  tools:install:
    desc: Install optional Go development tools (golangci-lint, GoReleaser, Air)
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - go install github.com/goreleaser/goreleaser/v2@v2.12.6
      - go install github.com/air-verse/air@v1.63.0

  deps:
    desc: Download Go module dependencies
    cmds:
      - go mod download

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  mod-check:
    desc: Check if go.mod/go.sum are tidy
    cmds:
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum

  fmt:
    desc: Format code with golangci-lint
    cmds:
      - '{{.GOLANGCI_LINT}} fmt'

  fmt-check:
    desc: Check golangci-lint formatting diff
    cmds:
      - '{{.GOLANGCI_LINT}} fmt --diff'

  lint:
    desc: Run golangci-lint code checks
    cmds:
      - '{{.GOLANGCI_LINT}} run'

  lint:new:
    desc: Check only new lint issues relative to BASE_REV
    cmds:
      - '{{.GOLANGCI_LINT}} run --new-from-rev={{.BASE_REV}}'

  lint:fix:
    desc: Auto-fix fixable issues with golangci-lint
    cmds:
      - '{{.GOLANGCI_LINT}} run --fix'

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run all tests (verbose output)
    cmds:
      - go test -v ./...

  test:race:
    desc: Run race detector tests
    cmds:
      - go test -race ./...

  test:integration:
    desc: Run CLI contract integration tests with redacted evidence
    cmds:
      - |
        set -eu
        run_id="$(date -u +%Y%m%dT%H%M%SZ)-$$"
        dir="temp/integration-test-runs/$run_id"
        command="go test ./cmd -run 'Output|Provider|Auth|List|Config|Version|DemoToday|DailyHub|Doctor|Quickstart|Contract|Audit|AgentExecute|SyncPullAll' -count=1"
        mkdir -p "$dir/artifacts"
        printf '%s\n' "$command" > "$dir/command.txt"
        python3 -c 'import json, os, sys; keys=("GOOS","GOARCH","TASKBRIDGE_HOME","TASKBRIDGE_STORAGE_PATH","NO_COLOR"); json.dump({k: os.environ.get(k, "") for k in keys}, open(sys.argv[1], "w"), ensure_ascii=False, indent=2)' "$dir/env.json"
        start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        start_s="$(date +%s)"
        set +e
        sh -c "$command" > "$dir/stdout.log" 2> "$dir/stderr.log"
        code=$?
        set -e
        finish="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        finish_s="$(date +%s)"
        python3 -c 'import json, sys; code=int(sys.argv[1]); start_s=int(sys.argv[4]); finish_s=int(sys.argv[5]); json.dump({"schema_version":"taskbridge.integration-evidence.v1","project":"taskbridge","run_id":sys.argv[2],"layer":"cli-contract","command":sys.argv[3],"status":"success" if code == 0 else "failed","exit_code":code,"started_at":sys.argv[6],"finished_at":sys.argv[7],"duration_ms":max(0, finish_s-start_s)*1000,"evidence":{"command":"command.txt","stdout":"stdout.log","stderr":"stderr.log","env":"env.json","artifacts":"artifacts/"},"redaction":{"env":"allowlist","secrets":"not captured"}}, open(sys.argv[8], "w"), ensure_ascii=False, indent=2)' "$code" "$run_id" "$command" "$start_s" "$finish_s" "$start" "$finish" "$dir/summary.json"
        exit "$code"

  build:
    desc: Build current platform binary to dist/
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -trimpath -ldflags '{{.LDFLAGS}}' -o {{.BIN}} .
      - '{{.BIN}} --help >/dev/null'

  install:
    desc: Install current platform taskbridge binary to Go bin
    cmds:
      - go install -trimpath -ldflags '{{.LDFLAGS}}' .

  snapshot:
    desc: Build current architecture snapshot with GoReleaser
    cmds:
      - '{{.GORELEASER}} build --snapshot --clean --single-target'

  release:check:
    desc: Validate GoReleaser config
    cmds:
      - '{{.GORELEASER}} check'

  release:local:
    desc: Local GoReleaser release rehearsal (no publish)
    cmds:
      - '{{.GORELEASER}} release --snapshot --clean --skip=publish'

  release:build:
    desc: Build release artifacts with GoReleaser (no publish)
    cmds:
      - '{{.GORELEASER}} build --clean'

  release:
    desc: Publish release with GoReleaser
    cmds:
      - '{{.GORELEASER}} release --clean'

  dev:
    desc: Format, test and build local binary
    cmds:
      - task: fmt
      - task: test
      - task: build

  dev:watch:
    desc: Watch files and rebuild CLI with Air (requires air)
    cmds:
      - '{{.AIR}}'

  docker:build:
    desc: Build Docker image
    cmds:
      - docker build -t taskbridge:latest .

  docker:build-no-cache:
    desc: Build Docker image (no cache)
    cmds:
      - docker build --no-cache -t taskbridge:latest .

  docker:up:
    desc: Start Docker container
    cmds:
      - docker compose up -d

  docker:down:
    desc: Stop Docker container
    cmds:
      - docker compose down

  docker:logs:
    desc: View Docker container logs
    cmds:
      - docker compose logs -f taskbridge

  docker:ps:
    desc: View Docker container status
    cmds:
      - docker compose ps

  docker:restart:
    desc: Restart Docker container
    cmds:
      - docker compose restart

  docker:shell:
    desc: Enter Docker container shell
    cmds:
      - docker compose exec taskbridge sh

  docker:clean:
    desc: Clean up Docker resources (containers, images, volumes)
    cmds:
      - docker compose down -v --rmi local

  docker:dev:
    desc: Development mode - build and start container
    deps: [docker:build]
    cmds:
      - docker compose up -d

  docker:full:
    desc: Full rebuild and start (no cache)
    cmds:
      - docker compose down
      - docker build --no-cache -t taskbridge:latest .
      - docker compose up -d

  docker:mongodb:
    desc: Start full service with MongoDB
    cmds:
      - docker compose --profile mongodb up -d

  check:
    desc: Run local quality gate (deps, modules, format, lint, test, build)
    cmds:
      - task: deps
      - task: mod-check
      - task: fmt-check
      - task: lint
      - task: test
      - task: build

  ci:
    desc: Run CI checks (check)
    cmds:
      - task: check
