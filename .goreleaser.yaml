# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: taskbridge

builds:
  - id: taskbridge
    binary: taskbridge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/yeisme/taskbridge/pkg/buildinfo.Version={{.Version}} -X github.com/yeisme/taskbridge/pkg/buildinfo.GitCommit={{.Commit}} -X github.com/yeisme/taskbridge/pkg/buildinfo.BuildDate={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: bundles
    ids: [taskbridge]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - License
      - docs/release-management.md
    format_overrides:
      - goos: windows
        formats: [zip]

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: taskbridge-sbom
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"

nfpms:
  - id: linux-packages
    ids: [taskbridge]
    package_name: taskbridge
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    homepage: https://github.com/yeisme/taskbridge
    maintainer: yeisme
    description: TaskBridge CLI for AI-assisted multi-provider task workflows.
    license: MIT
    contents:
      - src: README.md
        dst: /usr/share/doc/taskbridge/README.md
      - src: docs/release-management.md
        dst: /usr/share/doc/taskbridge/release-management.md
      - src: License
        dst: /usr/share/licenses/taskbridge/LICENSE

scoops:
  - name: taskbridge
    ids:
      - bundles
    repository:
      owner: yeisme
      name: scoop-bucket
      token: "{{ .Env.PUBLISHER_TOKEN }}"
    directory: bucket
    homepage: https://github.com/yeisme/taskbridge
    description: TaskBridge CLI for AI-assisted multi-provider task workflows.
    license: MIT
    url_template: "https://github.com/yeisme/taskbridge/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    skip_upload: "{{ .IsSnapshot }}"
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    commit_author:
      name: yeisme
      email: yeisme@users.noreply.github.com

homebrew_casks:
  - name: taskbridge
    ids:
      - bundles
    repository:
      owner: yeisme
      name: homebrew-tap
      token: "{{ .Env.PUBLISHER_TOKEN }}"
    directory: Casks
    homepage: https://github.com/yeisme/taskbridge
    description: TaskBridge CLI for AI-assisted multi-provider task workflows.
    license: MIT
    binaries:
      - taskbridge
    skip_upload: "{{ .IsSnapshot }}"
    commit_msg_template: "Homebrew cask update for {{ .ProjectName }} version {{ .Tag }}"
    commit_author:
      name: yeisme
      email: yeisme@users.noreply.github.com

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
